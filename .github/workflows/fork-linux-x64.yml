name: Fork Linux x64

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-linux-x64
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync upstream and PR 7494
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: sync
        name: Merge upstream main and PR head
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"

          git config user.name "t3code fork sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream \
            main \
            +refs/pull/7494/head:refs/remotes/upstream/pr-7494

          git merge --no-edit --no-ff upstream/main
          git merge --no-edit --no-ff upstream/pr-7494

          after="$(git rev-parse HEAD)"
          if [[ "$after" != "$before" ]]; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$after" >> "$GITHUB_OUTPUT"

      - name: Keep inherited workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r workflow_id workflow_path; do
            if [[ "$workflow_path" == ".github/workflows/fork-linux-x64.yml" ]]; then
              continue
            fi
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
              --jq '.workflows[] | select(.state == "active") | [.id, .path] | @tsv'
          )

  build:
    name: Build AppImage and portable tarball
    needs: sync
    if: github.event_name != 'schedule' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout synced commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Test the font fix
        run: vp test run --passWithNoTests --project unit apps/web/src/appearanceFonts.test.ts

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libsecret-1-dev pkg-config

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-linux-x64-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - id: version
        name: Set preview version and public T3 Connect config
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/server/package.json').version")"
          version="${base}-pr.${GITHUB_RUN_NUMBER}"
          cp .env.example .env
          node scripts/update-release-package-versions.ts "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --verbose

      - name: Build portable tarball
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target tar.gz \
            --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Verify files and write checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(release/*.AppImage)
          tarballs=(release/*.tar.gz)
          [[ ${#appimages[@]} -eq 1 ]]
          [[ ${#tarballs[@]} -eq 1 ]]
          file "${appimages[@]}" "${tarballs[@]}"
          tar -tzf "${tarballs[0]}" >/dev/null
          sha256sum "${appimages[@]}" "${tarballs[@]}" | sed 's#release/##' > release/SHA256SUMS

      - name: Upload Linux x64 builds
        uses: actions/upload-artifact@v7
        with:
          name: t3code-linux-x64-${{ steps.version.outputs.version }}
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
